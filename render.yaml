services:
  - type: web
    name: arisehub-agent-playground
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render routes the public service port to 10000 by default. The image
      # runs the frontend on this port and keeps FastAPI internal on 8001.
      - key: FRONTEND_PORT
        value: "10000"
      - key: BACKEND_PORT
        value: "8001"
      - key: DEEPTUTOR_API_BASE_URL
        value: http://127.0.0.1:8001
      - key: DEEPTUTOR_AUTH_ENABLED
        value: "false"
    disk:
      name: arisehub-agent-playground-data
      mountPath: /app/data
      sizeGB: 10
